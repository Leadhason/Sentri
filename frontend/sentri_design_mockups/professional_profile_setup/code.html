      }catch(_e){}</script></head><body class="antialiased min-h-screen flex flex-col items-center">

    <!-- TopAppBar -->
    <header class="bg-surface-container w-full border-b border-surface-variant flex items-center px-margin-mobile md:px-margin-desktop h-16 sticky top-0 z-50 relative justify-center">
        <button class="text-on-surface-variant hover:bg-surface-bright transition-colors p-2 active:scale-95 transition-transform duration-150 flex items-center justify-center rounded absolute left-4">
            <span class="material-symbols-outlined" data-icon="shield">shield</span>
        </button>
        <div class="font-headline-md text-headline-md font-bold text-primary tracking-tighter uppercase absolute left-1/2 transform -translate-x-1/2">

        </div>
        <button class="text-on-surface-variant font-label-caps text-label-caps uppercase hover:bg-surface-bright transition-colors p-2 active:scale-95 transition-transform duration-150 rounded absolute right-4">
            Skip
        </button>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow w-full max-w-container-max flex justify-center px-margin-mobile md:px-margin-desktop py-12 md:py-16">
        
        <div class="w-full max-w-2xl flex flex-col space-y-12">
            
            <!-- Header Section -->
            <section class="space-y-4">
                <h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface">
                    Set up your profile
                </h1>
                <p class="font-body-md text-body-md text-on-surface-variant max-w-lg">
                    Add a few details so clients know who they're hiring. You can always change this later.
                </p>
            </section>

            <!-- Form Container -->
            <form class="space-y-12 bg-surface-container border border-[#2D3748] p-6 md:p-8 relative">
                <!-- Chamfered Corner Graphic (Top Right) -->
                <div class="absolute top-0 right-0 w-8 h-8 overflow-hidden pointer-events-none">
                    <div class="absolute top-[-16px] right-[-16px] w-8 h-8 bg-[#12151A] transform rotate-45 border-b border-l border-[#2D3748]"></div>
                </div>

                <!-- 1. Profile Photo -->
                <div class="space-y-6">
                    <label class="font-label-caps text-label-caps uppercase text-primary block">Profile Photo</label>
                    <div class="flex items-center space-x-6">
                        <div class="w-24 h-24 rounded-full bg-surface-variant border-2 border-dashed border-[#3D5A80] flex items-center justify-center overflow-hidden">
                             <span class="material-symbols-outlined text-4xl text-on-surface-variant" data-icon="person">person</span>
                        </div>
                        <button type="button" class="border border-[#3D5A80] bg-transparent text-on-surface font-label-caps text-label-caps uppercase px-6 py-3 hover:bg-surface-bright transition-colors active:scale-95 flex items-center space-x-2">
                            <span class="material-symbols-outlined" data-icon="upload">upload</span>
                            <span class="">Upload Image</span>
                        </button>
                    </div>
                </div>

                <!-- 2. Professional Bio -->
                <div class="space-y-4">
                    <label for="bio" class="font-label-caps text-label-caps uppercase text-primary block">Professional Bio</label>
                    <textarea id="bio" rows="4" class="w-full form-input-bottom-border resize-none" placeholder="e.g., Experienced guard with 5+ years in executive protection..."></textarea>
                </div>

                <!-- 3. Hourly Rate -->
                <div class="space-y-4">
                    <label for="rate" class="font-label-caps text-label-caps uppercase text-primary block">Hourly Rate</label>
                    <div class="flex items-center space-x-2 border-b border-[#3D5A80] focus-within:border-[#F0A73B] transition-colors">
                        <span class="font-data-mono text-data-mono text-on-surface-variant">$</span>
                        <input type="number" id="rate" class="flex-grow bg-transparent border-none focus:ring-0 text-on-surface font-data-mono text-data-mono p-2" placeholder="0.00" min="0" step="1">
                        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">/hr</span>
                    </div>
                </div>

                <!-- 4. Experience Level -->
                <div class="space-y-4">
                    <label class="font-label-caps text-label-caps uppercase text-primary block">Experience Level</label>
                    <div class="flex flex-wrap gap-4">
                        <div class="relative">
                            <input type="radio" name="experience" id="exp-entry" class="sr-only chip-radio" value="entry">
                            <label for="exp-entry" class="cursor-pointer border border-[#3D5A80] bg-transparent text-on-surface font-label-caps text-label-caps uppercase px-4 py-2 hover:bg-surface-bright transition-colors inline-block">
                                Entry Level
                            </label>
                        </div>
                        <div class="relative">
                            <input type="radio" name="experience" id="exp-intermediate" class="sr-only chip-radio" value="intermediate" checked="">
                            <label for="exp-intermediate" class="cursor-pointer border border-[#3D5A80] bg-transparent text-on-surface font-label-caps text-label-caps uppercase px-4 py-2 hover:bg-surface-bright transition-colors inline-block">
                                Intermediate
                            </label>
                        </div>
                        <div class="relative">
                            <input type="radio" name="experience" id="exp-expert" class="sr-only chip-radio" value="expert">
                            <label for="exp-expert" class="cursor-pointer border border-[#3D5A80] bg-transparent text-on-surface font-label-caps text-label-caps uppercase px-4 py-2 hover:bg-surface-bright transition-colors inline-block">
                                Expert
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Primary Action -->
                <div class="pt-8 mt-8 border-t border-[#2D3748]">
                    <button type="submit" class="w-full bg-[#F0A73B] text-black font-label-caps text-label-caps uppercase py-4 hover:bg-primary-fixed transition-colors active:scale-95 flex items-center justify-center space-x-2">
                        <span class="">Save and Continue</span>
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
                    </button>
                </div>

        </div>
