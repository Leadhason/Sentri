<!-- BottomNavBar (From JSON) - Suppressed per rules: "Linear/Transactional or Task-Focused... prioritize the canvas." 
         This is an active job/mission screen, meaning the user is in a focused journey. 
         However, the JSON was provided as an anchor. If we strictly follow the Destination rule, we suppress it.
         I will suppress the BottomNav to keep the operative focused on the mission, as instructed by "The UX Goal". -->
<script>
        // Simple timer logic for the active job
        document.addEventListener('DOMContentLoaded', () => {
            const timerElement = document.getElementById('mission-timer');
            let seconds = 42 * 60 + 15; // Starting at 42:15

            setInterval(() => {
                seconds++;
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                
                timerElement.textContent = 
                    `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        });
    </script>
