<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Job Complete</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#001c39",
                        "on-surface": "#dee2ef",
                        "secondary": "#abc8f4",
                        "surface-container-lowest": "#090e17",
                        "on-secondary": "#103155",
                        "inverse-surface": "#dee2ef",
                        "inverse-on-surface": "#2c313a",
                        "on-primary-fixed": "#2a1800",
                        "error": "#ffb4ab",
                        "on-primary": "#462b00",
                        "secondary-container": "#2a486d",
                        "surface-variant": "#30353e",
                        "surface-container-highest": "#30353e",
                        "surface-bright": "#343943",
                        "outline": "#9f8e7c",
                        "on-background": "#dee2ef",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#643f00",
                        "background": "#0e141c",
                        "tertiary-container": "#ff9a8e",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "surface-dim": "#0e141c",
                        "outline-variant": "#514535",
                        "on-secondary-fixed-variant": "#2a486d",
                        "primary": "#ffc77f",
                        "on-surface-variant": "#d6c3af",
                        "inverse-primary": "#845400",
                        "on-tertiary-fixed-variant": "#891c17",
                        "surface-tint": "#ffb958",
                        "primary-fixed-dim": "#ffb958",
                        "primary-fixed": "#ffddb5",
                        "tertiary-fixed": "#ffdad5",
                        "on-secondary-container": "#9ab7e2",
                        "tertiary": "#ffc2bb",
                        "surface": "#0e141c",
                        "surface-container-low": "#171c25",
                        "secondary-fixed-dim": "#abc8f4",
                        "on-tertiary": "#680104",
                        "on-tertiary-fixed": "#410001",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#252a33",
                        "secondary-fixed": "#d3e3ff",
                        "on-primary-container": "#643f00",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#891c17",
                        "surface-container": "#1b2029",
                        "primary-container": "#f0a73b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "container-max": "1440px",
                        "unit": "4px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["IBM Plex Sans"],
                        "display-lg-mobile": ["Space Grotesk"],
                        "data-mono": ["IBM Plex Mono"],
                        "display-lg": ["Space Grotesk"],
                        "body-md": ["IBM Plex Sans"],
                        "label-caps": ["IBM Plex Mono"],
                        "headline-md": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "data-mono": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Tactical Ticket Notch */
        .ticket-notch-top-bottom {
            position: relative;
        }
        .ticket-notch-top-bottom::before,
        .ticket-notch-top-bottom::after {
            content: '';
            position: absolute;
            right: -6px;
            width: 12px;
            height: 12px;
            background-color: theme('colors.surface-container');
            border: 1px solid theme('colors.secondary-container');
            transform: rotate(45deg);
            z-index: 10;
        }
        .ticket-notch-top-bottom::before {
            top: -6px;
            border-bottom-color: transparent;
            border-right-color: transparent;
        }
        .ticket-notch-top-bottom::after {
            bottom: -6px;
            border-top-color: transparent;
            border-left-color: transparent;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased selection:bg-primary/30">
<!-- Main Confirmation Panel (Level 1 Surface) -->
<main class="w-full max-w-lg bg-surface-container border border-secondary-container relative overflow-hidden flex flex-col items-center p-8 md:p-12 shadow-2xl">
<!-- Hero Chamfer (Top Right) -->
<div class="absolute top-0 right-0 w-16 h-16 bg-background transform translate-x-8 -translate-y-8 rotate-45 border-l border-b border-secondary-container"></div>
<!-- Header / Status -->
<div class="flex flex-col items-center text-center mb-8 mt-4 z-10 w-full">
<div class="w-16 h-16 rounded-full border-2 border-primary-container flex items-center justify-center mb-6 shadow-[0_0_15px_rgba(240,167,59,0.2)]">
<span class="material-symbols-outlined icon-fill text-primary-container text-4xl" data-icon="check_circle">check_circle</span>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-2 tracking-tight">JOB COMPLETE</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Thank you. The operation has been successfully concluded.</p>
</div>
<!-- Dispatch-Ticket Summary Row -->
<div class="w-full border border-secondary-container bg-surface relative mb-8 flex flex-col ticket-notch-top-bottom">
<!-- Accent Bar -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container"></div>
<div class="p-4 pl-6 flex justify-between items-center border-b border-surface-container-highest">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Reference ID</span>
<span class="font-data-mono text-data-mono text-on-surface">OP-7742-X</span>
</div>
<div class="p-4 pl-6 flex justify-between items-center">
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Time of Completion</span>
<span class="font-data-mono text-data-mono text-primary">08:00 AM MST</span>
</div>
</div>
<!-- Rate Service Section -->
<div class="w-full flex flex-col items-center mb-10 border-t border-surface-container-highest pt-8 mt-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-4 block">Rate Service Protocol</span>
<div class="flex gap-2" id="rating-container">
<button class="rating-star focus:outline-none transition-transform hover:scale-110 group" data-value="1">
<span class="material-symbols-outlined text-3xl text-surface-variant group-hover:text-primary transition-colors" data-icon="star">star</span>
</button>
<button class="rating-star focus:outline-none transition-transform hover:scale-110 group" data-value="2">
<span class="material-symbols-outlined text-3xl text-surface-variant group-hover:text-primary transition-colors" data-icon="star">star</span>
</button>
<button class="rating-star focus:outline-none transition-transform hover:scale-110 group" data-value="3">
<span class="material-symbols-outlined text-3xl text-surface-variant group-hover:text-primary transition-colors" data-icon="star">star</span>
</button>
<button class="rating-star focus:outline-none transition-transform hover:scale-110 group" data-value="4">
<span class="material-symbols-outlined text-3xl text-surface-variant group-hover:text-primary transition-colors" data-icon="star">star</span>
</button>
<button class="rating-star focus:outline-none transition-transform hover:scale-110 group" data-value="5">
<span class="material-symbols-outlined text-3xl text-surface-variant group-hover:text-primary transition-colors" data-icon="star">star</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-primary-container text-surface-container-lowest font-label-caps text-label-caps py-4 px-6 uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-surface-tint transition-colors focus:ring-2 focus:ring-primary focus:outline-none">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                Return to Dashboard
            </button>
<button class="w-full bg-transparent border border-secondary-container text-on-surface font-label-caps text-label-caps py-4 px-6 uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors focus:ring-2 focus:ring-secondary-container focus:outline-none">
<span class="material-symbols-outlined" data-icon="download">download</span>
                Download Receipt
            </button>
</div>
</main>
<script>
        // Simple star rating interaction
        const stars = document.querySelectorAll('.rating-star');
        
        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                const value = parseInt(e.currentTarget.getAttribute('data-value'));
                
                stars.forEach((s, index) => {
                    const icon = s.querySelector('span');
                    if (index < value) {
                        icon.classList.add('icon-fill');
                        icon.classList.remove('text-surface-variant');
                        icon.classList.add('text-primary');
                    } else {
                        icon.classList.remove('icon-fill');
                        icon.classList.add('text-surface-variant');
                        icon.classList.remove('text-primary');
                    }
                });
            });
        });
    </script>
</body></html>
