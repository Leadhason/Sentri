<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>In-App Call - Sentri</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#410001",
                        "on-surface-variant": "#d6c3af",
                        "on-error": "#690005",
                        "on-secondary": "#103155",
                        "surface-bright": "#343943",
                        "primary-fixed-dim": "#ffb958",
                        "primary-fixed": "#ffddb5",
                        "on-error-container": "#ffdad6",
                        "background": "#0e141c",
                        "surface-dim": "#0e141c",
                        "on-primary-container": "#643f00",
                        "on-background": "#dee2ef",
                        "on-tertiary": "#680104",
                        "on-secondary-container": "#9ab7e2",
                        "surface": "#0e141c",
                        "on-tertiary-fixed-variant": "#891c17",
                        "on-primary-fixed": "#2a1800",
                        "secondary-fixed": "#d3e3ff",
                        "surface-container-highest": "#30353e",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#ffdad5",
                        "primary": "#ffc77f",
                        "on-primary": "#462b00",
                        "secondary-fixed-dim": "#abc8f4",
                        "on-tertiary-container": "#891c17",
                        "secondary-container": "#2a486d",
                        "inverse-on-surface": "#2c313a",
                        "surface-container-lowest": "#090e17",
                        "surface-variant": "#30353e",
                        "inverse-surface": "#dee2ef",
                        "primary-container": "#f0a73b",
                        "surface-container": "#1b2029",
                        "tertiary-container": "#ff9a8e",
                        "on-secondary-fixed": "#001c39",
                        "error-container": "#93000a",
                        "surface-container-high": "#252a33",
                        "outline": "#9f8e7c",
                        "surface-container-low": "#171c25",
                        "tertiary": "#ffc2bb",
                        "surface-tint": "#ffb958",
                        "on-secondary-fixed-variant": "#2a486d",
                        "on-primary-fixed-variant": "#643f00",
                        "on-surface": "#dee2ef",
                        "inverse-primary": "#845400",
                        "outline-variant": "#514535",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "secondary": "#abc8f4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "body-lg": ["IBM Plex Sans"],
                        "label-caps": ["IBM Plex Mono"],
                        "display-lg": ["Space Grotesk"],
                        "data-mono": ["IBM Plex Mono"],
                        "body-md": ["IBM Plex Sans"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Tactical grid background effect */
        .bg-tactical-grid {
            background-image: 
                linear-gradient(to right, rgba(81, 69, 53, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(81, 69, 53, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        /* Ambient vignette */
        .vignette-overlay {
            background: radial-gradient(circle at center, transparent 0%, rgba(14, 20, 28, 0.8) 100%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full overflow-hidden flex flex-col font-body-md antialiased relative">
<!-- Background Layers -->
<div class="absolute inset-0 bg-tactical-grid z-0"></div>
<div class="absolute inset-0 vignette-overlay z-0 pointer-events-none"></div>
<!-- Header / Brand Anchor -->
<header class="relative z-10 w-full flex justify-center items-center h-24 pt-8">
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-tighter text-primary">SENTRI</h1>
</header>
<!-- Main Call Status Area -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-gutter w-full max-w-md mx-auto -mt-12">
<!-- Pulsing Avatar Assembly -->
<div class="relative w-48 h-48 flex items-center justify-center mb-8">
<!-- Outer radar pulse -->
<div class="absolute inset-0 rounded-full border border-primary/20 animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<!-- Inner ring -->
<div class="absolute inset-6 rounded-full border border-primary/40 animate-pulse"></div>
<!-- Avatar Surface -->
<div class="relative z-10 w-32 h-32 bg-surface-container rounded-full border border-outline-variant flex items-center justify-center shadow-2xl shadow-primary/10 overflow-hidden">
<span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings: 'FILL' 1;">shield_person</span>
<!-- Subtle grid overlay on avatar -->
<div class="absolute inset-0 bg-tactical-grid opacity-30 mix-blend-overlay"></div>
</div>
<!-- Secure Connection Badge -->
<div class="absolute bottom-4 right-4 z-20 bg-surface-container border border-outline-variant rounded-full p-1.5 flex items-center justify-center">
<span class="material-symbols-outlined text-sm text-primary">lock</span>
</div>
</div>
<!-- Call Details -->
<div class="text-center space-y-3">
<h2 class="font-headline-md text-headline-md text-on-surface tracking-wide">Sentri Dispatch</h2>
<!-- Timer Display -->
<div class="flex items-center justify-center space-x-3 bg-surface-container-high px-4 py-2 rounded-full border border-outline-variant/50 shadow-inner">
<div class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-primary"></span>
</div>
<span class="font-data-mono text-data-mono text-primary-fixed-dim" id="call-timer">02:45</span>
</div>
</div>
</main>
<!-- Call Controls Dock -->
<footer class="relative z-10 w-full pb-safe mb-12 px-gutter">
<div class="max-w-xs mx-auto grid grid-cols-3 gap-6 items-end">
<!-- Mute Action -->
<button class="flex flex-col items-center space-y-3 group focus:outline-none">
<div class="w-16 h-16 rounded-full bg-surface-container border border-secondary-container flex items-center justify-center group-hover:bg-surface-container-highest transition-all duration-200 shadow-md group-active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant text-2xl group-hover:text-on-surface transition-colors">mic_off</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface transition-colors">Mute</span>
</button>
<!-- End Call Action -->
<button aria-label="End Call" class="flex flex-col items-center justify-end space-y-4 group focus:outline-none">
<div class="w-20 h-20 rounded-full bg-error-container border-2 border-error/50 flex items-center justify-center hover:bg-error transition-all duration-200 shadow-[0_0_20px_rgba(147,0,10,0.4)] hover:shadow-[0_0_30px_rgba(255,180,171,0.5)] group-active:scale-90">
<span class="material-symbols-outlined text-on-error-container group-hover:text-on-error text-3xl transition-colors" style="font-variation-settings: 'FILL' 1;">call_end</span>
</div>
<!-- Label removed for cleaner look, button shape/color is explicit enough -->
</button>
<!-- Speaker Action -->
<button class="flex flex-col items-center space-y-3 group focus:outline-none">
<div class="w-16 h-16 rounded-full bg-surface-container border border-secondary-container flex items-center justify-center group-hover:bg-surface-container-highest transition-all duration-200 shadow-md group-active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant text-2xl group-hover:text-on-surface transition-colors">volume_up</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface transition-colors">Speaker</span>
</button>
</div>
</footer>
<!-- Simple Script for Timer -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timerElement = document.getElementById('call-timer');
            let seconds = 165; // Starting at 02:45

            setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerElement.textContent = `${mins}:${secs}`;
            }, 1000);
        });
    </script>
</body></html>
