<!DOCTYPE html><html lang="en" class="dark" style=""><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdad5",
                        "on-primary": "#462b00",
                        "primary": "#ffc77f",

                        "primary-container": "#f0a73b",
                        "surface-container-lowest": "#090e17",
                        "inverse-surface": "#dee2ef",
                        "surface-variant": "#30353e",
                        "tertiary-container": "#ff9a8e",
                        "on-secondary-fixed": "#001c39",
                        "error-container": "#93000a",
                        "surface-container": "#1b2029",
                        "surface-container-low": "#171c25",
                        "surface-container-high": "#252a33",
                        "outline": "#9f8e7c",
                        "on-secondary-fixed-variant": "#2a486d",
                        "on-primary-fixed-variant": "#643f00",
                        "on-surface": "#dee2ef",
                        "inverse-primary": "#845400",
                        "tertiary": "#ffc2bb",
                        "surface-tint": "#ffb958",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "secondary": "#abc8f4",
                        "outline-variant": "#514535",
                        "on-surface-variant": "#d6c3af",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#410001",
                        "surface-bright": "#343943",
                        "on-secondary": "#103155",
                        "background": "#0e141c",
                        "on-primary-container": "#643f00",
                        "surface-dim": "#0e141c",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#ffddb5",
                        "primary-fixed-dim": "#ffb958",
                        "on-tertiary": "#680104",
                        "on-background": "#dee2ef",
                        "surface": "#0e141c",
                        "on-secondary-container": "#9ab7e2",
                        "on-primary-fixed": "#2a1800",
                        "on-tertiary-fixed-variant": "#891c17",
                        "surface-container-highest": "#30353e",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#d3e3ff",
                        "steel": "#3D5A80"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "body-md": ["IBM Plex Sans"],
                        "data-mono": ["IBM Plex Mono"],
                        "display-lg": ["Space Grotesk"],
                        "label-caps": ["IBM Plex Mono"],
                        "display-lg-mobile": ["Space Grotesk"],
                        "body-lg": ["IBM Plex Sans"],
                        "headline-md": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    }catch(_e){}</script></head><body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-black">

    <!-- Intent: Linear/Transactional. Navigation Shell Suppressed -->

    <!-- Top AppBar (Simplified for Transactional) -->
    <header class="bg-surface border-b border-surface-container-high w-full px-margin-mobile md:px-margin-desktop py-unit flex justify-between items-center z-50 sticky top-0"><div class="flex items-center w-1/3">
            <button class="text-on-surface-variant hover:text-primary transition-colors active:opacity-70 flex items-center justify-center p-2 rounded-full" aria-label="Go back">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
            </button>
        </div>
        <div class="flex justify-center items-center flex-grow">
            <span class="font-label-caps text-label-caps tracking-widest text-primary uppercase">Sentri</span>
        </div>
        <div class="flex items-center justify-end w-1/3">
            <span class="font-data-mono text-data-mono text-on-surface-variant">v1.0</span>
        </div></header>

    <!-- Main Content Canvas -->
    <main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-container-max mx-auto">
        
        <div class="w-full max-w-md flex flex-col gap-8">
            
            <!-- Hero Panel -->
            <div class="chamfer-border w-full p-6 md:p-8 flex flex-col gap-4 shadow-xl shadow-black/50">
                <div class="flex justify-between items-start">
                    <h1 class="font-headline-md text-headline-md text-on-surface">Create your account</h1>
                    <a href="#" class="font-label-caps text-label-caps text-secondary-container hover:text-primary transition-colors uppercase border-secondary-container hover:border-primary">Change Role</a>
                </div>
                <p class="font-body-md text-body-md text-on-surface-variant">Join Sentri to find and book vetted security for any event.</p>
                
                
            </div>

            <!-- Registration Form -->
            <form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
                
                <div class="flex flex-col gap-2">
                    <label for="fullName" class="font-label-caps text-label-caps text-on-surface-variant uppercase">Full Name</label>
                    <input type="text" id="fullName" class="sentri-input w-full bg-surface-dim border-0 border-steel text-on-surface font-body-md text-body-md px-0 py-3 transition-colors bg-surface-container-low px-4 rounded-lg" placeholder="e.g. Jane Doe" required="">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="emailAddress" class="font-label-caps text-label-caps text-on-surface-variant uppercase">Email Address</label>
                    <input type="email" id="emailAddress" class="sentri-input w-full bg-surface-dim border-0 border-steel text-on-surface font-body-md text-body-md px-0 py-3 transition-colors bg-surface-container-low px-4 rounded-lg" placeholder="jane.doe@organization.com" required="">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="phoneNumber" class="font-label-caps text-label-caps text-on-surface-variant uppercase">Phone Number</label>
                    <input type="tel" id="phoneNumber" class="sentri-input w-full bg-surface-dim border-0 border-steel text-on-surface font-body-md text-body-md px-0 py-3 transition-colors bg-surface-container-low px-4 rounded-lg" placeholder="+1 (555) 000-0000" required="">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="password" class="font-label-caps text-label-caps text-on-surface-variant uppercase">Password</label>
                    <div class="relative w-full">
                        <input type="password" id="password" class="sentri-input w-full bg-surface-dim border-0 border-steel text-on-surface font-body-md text-body-md px-0 py-3 pr-10 transition-colors bg-surface-container-low px-4 rounded-lg" placeholder="Minimum 12 characters" required="">
                        <button type="button" class="absolute right-0 top-1/2 -translate-y-1/2 text-steel hover:text-on-surface transition-colors p-2" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="mt-8">
                    <button type="submit" class="w-full bg-primary-container text-black font-label-caps text-label-caps uppercase py-4 px-6 hover:bg-primary transition-colors active:scale-[0.98] flex justify-center items-center gap-2"><span class="">Create Account</span></button></div></form></div></main></body></html>
