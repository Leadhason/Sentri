<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log Incident - SENTRI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0e141c",
                        "on-tertiary-fixed": "#410001",
                        "surface-container-low": "#171c25",
                        "secondary-fixed-dim": "#abc8f4",
                        "on-tertiary": "#680104",
                        "on-error-container": "#ffdad6",
                        "primary-container": "#f0a73b",
                        "surface-container": "#1b2029",
                        "on-tertiary-container": "#891c17",
                        "surface-container-high": "#252a33",
                        "secondary-fixed": "#d3e3ff",
                        "on-primary-container": "#643f00",
                        "error-container": "#93000a",
                        "inverse-primary": "#845400",
                        "primary": "#ffc77f",
                        "on-surface-variant": "#d6c3af",
                        "on-secondary-fixed-variant": "#2a486d",
                        "on-tertiary-fixed-variant": "#891c17",
                        "primary-fixed-dim": "#ffb958",
                        "primary-fixed": "#ffddb5",
                        "surface-tint": "#ffb958",
                        "tertiary": "#ffc2bb",
                        "tertiary-fixed": "#ffdad5",
                        "on-secondary-container": "#9ab7e2",
                        "on-primary-fixed": "#2a1800",
                        "inverse-on-surface": "#2c313a",
                        "secondary-container": "#2a486d",
                        "on-primary": "#462b00",
                        "error": "#ffb4ab",
                        "background": "#0e141c",
                        "on-primary-fixed-variant": "#643f00",
                        "on-error": "#690005",
                        "surface-variant": "#30353e",
                        "surface-container-highest": "#30353e",
                        "surface-bright": "#343943",
                        "outline": "#9f8e7c",
                        "on-background": "#dee2ef",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "surface-dim": "#0e141c",
                        "outline-variant": "#514535",
                        "tertiary-container": "#ff9a8e",
                        "on-surface": "#dee2ef",
                        "on-secondary-fixed": "#001c39",
                        "secondary": "#abc8f4",
                        "surface-container-lowest": "#090e17",
                        "on-secondary": "#103155",
                        "inverse-surface": "#dee2ef"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1440px",
                        "unit": "4px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Space Grotesk"],
                        "body-lg": ["IBM Plex Sans"],
                        "data-mono": ["IBM Plex Mono"],
                        "label-caps": ["IBM Plex Mono"],
                        "headline-md": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "body-md": ["IBM Plex Sans"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0; }
        .fill-icon .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        
        /* Custom Scrollbar for Textarea */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0e141c; }
        ::-webkit-scrollbar-thumb { background: #30353e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #514535; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface flex items-center justify-between px-margin-mobile h-16 w-full border-b border-outline-variant flat no shadows docked full-width top-0 shrink-0 md:px-margin-desktop z-50 sticky top-0">
<button aria-label="shield" class="text-primary hover:text-primary transition-colors active:scale-95 transition-transform p-2 -ml-2">
<span class="material-symbols-outlined text-2xl">shield</span>
</button>
<div class="font-display-lg-mobile text-display-lg-mobile tracking-tighter text-primary md:font-display-lg md:text-display-lg flex-1 text-center truncate px-4">
            SENTRI
        </div>
<button aria-label="notifications" class="text-on-surface-variant hover:text-primary transition-colors active:scale-95 transition-transform p-2 -mr-2">
<span class="material-symbols-outlined text-2xl">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-8 md:px-margin-desktop md:py-12 w-full max-w-container-max mx-auto pb-32">
<div class="max-w-2xl mx-auto w-full">
<div class="mb-8 border-b border-outline-variant pb-4">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Log Incident</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Submit an operational report to dispatch immediately.</p>
</div>
<!-- Report Form -->
<form class="space-y-6">
<!-- Type of Issue Dropdown -->
<div class="bg-surface-container border border-secondary-container rounded p-6 shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="issue-type">Type of Issue</label>
<div class="relative">
<select class="block w-full bg-background border-0 border-b border-secondary-container text-on-surface font-body-lg text-body-lg focus:ring-0 focus:border-primary px-0 py-3 appearance-none cursor-pointer" id="issue-type" name="issue-type">
<option class="bg-surface-container text-on-surface-variant" disabled="" selected="" value="">Select category...</option>
<option class="bg-surface-container" value="noise">Noise Disturbance</option>
<option class="bg-surface-container" value="intrusion">Unauthorized Intrusion</option>
<option class="bg-surface-container" value="equipment">Equipment Failure</option>
<option class="bg-surface-container" value="other">Other Observation</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Description Text Area -->
<div class="bg-surface-container border border-secondary-container rounded p-6 shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="description">Detailed Description</label>
<textarea class="block w-full bg-background border-0 border-b border-secondary-container text-on-surface font-body-md text-body-md focus:ring-0 focus:border-primary px-0 py-3 resize-none placeholder:text-on-surface-variant/50" id="description" name="description" placeholder="Provide situational context, subjects involved, and actions taken..." rows="5"></textarea>
</div>
<!-- Photo Upload -->
<div class="bg-surface-container border border-secondary-container rounded p-6 shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-4">Evidence Upload</label>
<div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-outline-variant border-dashed rounded-DEFAULT bg-surface/50 hover:bg-surface-bright transition-colors cursor-pointer group">
<div class="space-y-1 text-center">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors mb-2 block">add_a_photo</span>
<div class="flex text-sm justify-center">
<span class="font-data-mono text-data-mono text-primary focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-primary rounded-md">
                                    Upload a file
                                </span>
<p class="pl-1 font-body-md text-body-md text-on-surface-variant">or drag and drop</p>
</div>
<p class="font-data-mono text-[10px] text-on-surface-variant/70 mt-2">
                                PNG, JPG up to 10MB
                            </p>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-6">
<button class="w-full bg-[#F0A73B] text-black font-label-caps text-label-caps py-4 px-6 rounded-none hover:bg-primary-fixed transition-colors active:scale-[0.98] flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-lg">send</span>
                        SUBMIT REPORT
                    </button>
</div>
</form>
</div>
</main>
<!-- BottomNavBar (Mobile Only) - Suppressed per rules for transactional/task flow -->
<!-- Nav is suppressed because logging an incident is a linear/task-focused flow. -->
<script>
        // Simple form interaction logic
        document.querySelectorAll('input, textarea, select').forEach(element => {
            element.addEventListener('focus', function() {
                this.closest('.bg-surface-container').classList.add('border-primary');
            });
            element.addEventListener('blur', function() {
                this.closest('.bg-surface-container').classList.remove('border-primary');
            });
        });
    </script>
</body></html>
