<!DOCTYPE html><html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdad5",

                        "inverse-surface": "#dee2ef",
                        "surface-variant": "#30353e",
                        "tertiary-container": "#ff9a8e",
                        "on-secondary-fixed": "#001c39",
                        "error-container": "#93000a",
                        "surface-container": "#1b2029",
                        "surface-container-low": "#171c25",
                        "surface-container-high": "#252a33",
                        "outline": "#9f8e7c",
                        "on-secondary-fixed-variant": "#2a486d",
                        "on-primary-fixed-variant": "#643f00",
                        "on-surface": "#dee2ef",
                        "inverse-primary": "#845400",
                        "tertiary": "#ffc2bb",
                        "surface-tint": "#ffb958",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "secondary": "#abc8f4",
                        "outline-variant": "#514535",
                        "on-surface-variant": "#d6c3af",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#410001",
                        "surface-bright": "#343943",
                        "on-secondary": "#103155",
                        "background": "#0e141c",
                        "on-primary-container": "#643f00",
                        "surface-dim": "#0e141c",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#ffddb5",
                        "primary-fixed-dim": "#ffb958",
                        "on-tertiary": "#680104",
                        "on-background": "#dee2ef",
                        "surface": "#0e141c",
                        "on-secondary-container": "#9ab7e2",
                        "on-primary-fixed": "#2a1800",
                        "on-tertiary-fixed-variant": "#891c17",
                        "surface-container-highest": "#30353e",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#d3e3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "body-md": ["IBM Plex Sans"],
                        "data-mono": ["IBM Plex Mono"],
                        "display-lg": ["Space Grotesk"],
                        "label-caps": ["IBM Plex Mono"],
                        "display-lg-mobile": ["Space Grotesk"],
                        "body-lg": ["IBM Plex Sans"],
                        "headline-md": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    }catch(_e){}</script></head><body class="min-h-screen flex items-center justify-center p-4">

    <!-- Auth Container -->
    <div class="panel w-full max-w-md p-8 md:p-12 relative overflow-hidden">
        
        <!-- Top Right Chamfer Effect -->
        <div class="absolute top-0 right-0 w-8 h-8 bg-[#12151A] transform translate-x-4 -translate-y-4 rotate-45 border-l border-b border-[#2D3748]"></div>

        <!-- Logo & Header -->
        <div class="flex flex-col items-center mb-10">
            <div class="diamond-aperture mb-6"></div>
            <h1 class="font-headline-md text-headline-md text-on-surface tracking-wide uppercase">Sentri</h1>
            <p class="font-data-mono text-data-mono text-on-surface-variant mt-2 uppercase">Sign In</p>
        </div>

        <!-- Login-->
        <form class="space-y-6 space-y-8">
            
            <div class="space-y-1">
                <label class="font-label-caps text-sm text-on-surface-variant block uppercase" for="email">Email</label>
                <input type="email" id="email" class="input-field font-data-mono text-data-mono" placeholder="admin@sentri.net" required="" autocomplete="email">
            </div>

            <div class="space-y-1">
                <label class="font-label-caps text-sm text-on-surface-variant block uppercase" for="password">Password</label>
                <input type="password" id="password" class="input-field font-data-mono text-data-mono" placeholder="••••••••" required="" autocomplete="current-password">
            </div>

            <div class="flex items-center justify-between pt-2">
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 bg-[#12151A] border border-[#3D5A80] rounded-none focus:ring-0 focus:ring-offset-0 text-[#F0A73B]">
                    <label for="remember" class="font-data-mono text-data-mono text-on-surface-variant">Keep Session Active</label>
                </div>
            </div>

            <button type="submit" class="btn-primary mt-6 flex justify-center items-center gap-2">
                <span class="">Sign In</span>
                <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">login</span>
            </button>
        </form>

        <!-- Links -->
        <div class="mt-8 flex flex-col items-center space-y-4">
            <a href="#" class="font-data-mono text-data-mono text-primary-container hover:text-primary transition-colors hover:underline">Forgot password?</a>
            <a href="#" class="font-data-mono text-data-mono text-on-surface-variant hover:text-on-surface transition-colors">Don't have an account? <span class="text-primary-container hover:underline">Create one</span></a>
        </div>
        
        <!-- Bottom Status Indicator -->
        </div></body></html>
