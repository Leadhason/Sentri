<!DOCTYPE html><html lang="en" class="dark" style=""><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#680104",
                        "on-tertiary-fixed": "#410001",
                        "surface-container-low": "#171c25",
                        "on-surface": "#dee2ef",
                        "secondary-fixed-dim": "#abc8f4",
                        "on-primary-container": "#643f00",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#30353e",
                        "inverse-on-surface": "#2c313a",
                        "inverse-surface": "#dee2ef",
                        "surface-container-high": "#252a33",
                        "on-error": "#690005",
                        "on-secondary": "#103155",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "secondary-fixed": "#d3e3ff",
                        "on-background": "#dee2ef",
                        "secondary": "#abc8f4",
                        "surface-dim": "#0e141c",
                        "surface-container-lowest": "#090e17",
                        "surface-bright": "#343943",
                        "surface-tint": "#ffb958",
                        "primary-fixed-dim": "#ffb958",
                        "on-error-container": "#ffdad6",
                        "outline": "#9f8e7c",
                        "secondary-container": "#2a486d",
                        "on-tertiary-container": "#891c17",
                        "background": "#0e141c",
                        "tertiary-container": "#ff9a8e",
                        "tertiary-fixed": "#ffdad5",
                        "primary-container": "#f0a73b",
                        "primary-fixed": "#ffddb5",
                        "on-primary": "#462b00",
                        "primary": "#ffc77f",
                        "outline-variant": "#514535",
                        "error-container": "#93000a",
                        "inverse-primary": "#845400",
                        "surface-container": "#1b2029",
                        "on-secondary-container": "#9ab7e2",
                        "on-primary-fixed-variant": "#643f00",
                        "surface-variant": "#30353e",
                        "on-secondary-fixed": "#001c39",
                        "surface": "#0e141c",
                        "on-surface-variant": "#d6c3af",
                        "on-secondary-fixed-variant": "#2a486d",
                        "on-primary-fixed": "#2a1800",
                        "tertiary": "#ffc2bb",
                        "on-tertiary-fixed-variant": "#891c17"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"],
                        "body-lg": ["IBM Plex Sans"],
                        "body-md": ["IBM Plex Sans"],
                        "label-caps": ["IBM Plex Mono"],
                        "display-lg": ["Space Grotesk"],
                        "data-mono": ["IBM Plex Mono"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-mono": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    }catch(_e){}</script></head><body class="antialiased min-h-screen flex flex-col font-body-md text-body-md selection:bg-primary-container selection:text-on-primary">

    <!-- TopAppBar -->
    <header class="docked full-width top-0 bg-surface-dim dark:bg-surface-dim border-b border-outline-variant dark:border-outline-variant flat no shadows w-full px-margin-mobile h-16 sticky z-40 grid grid-cols-3">
        <div class="flex items-center gap-4 col-start-2 justify-center"><span class="material-symbols-outlined text-primary dark:text-primary" data-icon="shield" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">shield</span>
            <span class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tighter text-primary dark:text-primary">SENTRI</span></div>
        <div class="flex justify-end items-center">
            <span class="material-symbols-outlined text-primary dark:text-primary hover:text-primary-fixed-dim transition-colors cursor-pointer" data-icon="account_circle" data-original-icon="account_circle">account_circle</span>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-1 w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 mb-24">
        
        <div class="max-w-2xl mx-auto">
            <!-- Header Section -->
            <div class="mb-8">
                <h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-2">Tell us what you need.</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Describe your current situation, and our AI will immediately generate a tailored security assessment and deployment plan.</p>
            </div>

            <!-- Form Container -->
            <div class="surface-panel rounded-DEFAULT p-6 relative">
                <!-- 45-degree chamfered corner top-right -->
                <div class="absolute top-0 right-0 w-8 h-8 bg-[#12151A]" style="clip-path: polygon(100% 0, 0 0, 100% 100%);"></div>

                <form class="space-y-8 mt-2">
                    
                    <!-- Assessment Description -->
                    <div class="space-y-3">
                        <label for="description" class="font-label-caps text-label-caps text-on-surface block uppercase tracking-wider">Assessment Description</label>
                        <textarea id="description" rows="6" class="input-void w-full p-3 font-data-mono text-data-mono resize-none focus:ring-0" placeholder="E.g., High-profile executive requires secure transport from airport to downtown hotel over a 3-day period. Known potential risks include..."></textarea>
                    </div>

                    <!-- Urgency Toggle -->
                    <div class="space-y-3">
                        <label class="font-label-caps text-label-caps text-on-surface block uppercase tracking-wider">Operational Urgency</label>
                        <div class="flex gap-4">
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="urgency" value="routine" class="peer sr-only" checked="">
                                <div class="w-full text-center py-3 border border-[#3D5A80] text-on-surface peer-checked:bg-[#3D5A80] peer-checked:text-white transition-colors">
                                    <span class="font-label-caps text-label-caps">ROUTINE</span>
                                </div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="urgency" value="emergency" class="peer sr-only">
                                <div class="w-full text-center py-3 border border-[#3D5A80] text-on-surface peer-checked:bg-error peer-checked:text-on-error peer-checked:border-error transition-colors">
                                    <span class="font-label-caps text-label-caps">EMERGENCY</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <div class="pt-4">
                        <button type="button" class="w-full bg-primary-container text-black font-label-caps text-label-caps py-4 uppercase tracking-wider hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined" data-icon="memory">memory</span>
                            Get Assessment
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center justify-around gap-4 px-6 py-3 bg-surface-container/90 dark:bg-surface-container/90 w-auto min-w-[280px] rounded-full backdrop-blur-md border border-outline-variant dark:border-outline-variant shadow-lg md:hidden">
        <a href="#" class="text-on-surface-variant dark:text-on-surface-variant p-3 hover:bg-surface-container-high dark:hover:bg-surface-container-high rounded-full transition-all flex flex-col items-center">
            <span class="material-symbols-outlined" data-icon="analytics">analytics</span>
        </a>
        <a href="#" class="bg-primary dark:bg-primary text-on-primary dark:text-on-primary rounded-full p-3 hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-all flex flex-col items-center">
            <span class="material-symbols-outlined" data-icon="assignment" data-weight="fill" style="font-variation-settings: 'FILL' 1;">assignment</span>
        </a>
        </nav></body></html>
